# Render Blueprint Specification (Infrastructure-as-Code)
# Documentation: https://render.com/docs/blueprint-spec

services:
  # Backend API Web Service
  - type: web
    name: vendor-management-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: pnpm install
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://vendorlink-mocha.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vendor-management-db
          property: connectionString
      - key: IMGBB_API_KEY
        sync: false

databases:
  # Managed PostgreSQL Database
  - name: vendor-management-db
    plan: free
    region: oregon
    databaseName: vendor_management
    user: vendor_user
